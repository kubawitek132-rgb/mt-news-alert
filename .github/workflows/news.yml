name: MT NEWS ALERT

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Wyślij testową wiadomość do Telegrama"
        required: false
        default: false
        type: boolean

concurrency:
  group: mt-news-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj wymagania
        run: pip install -r requirements.txt

      - name: Uruchom bota
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TIMEZONE: Europe/Warsaw
          STATE_DB: stan.db
          NEWS_TEST_MODE: ${{ inputs.send_test || 'false' }}
        run: python bot.py

      - name: Zapisz stan alertów
        run: |
          git config user.name "MT NEWS ALERT"
          git config user.email "actions@users.noreply.github.com"
          git add stan.db

          if ! git diff --cached --quiet; then
            git commit -m "Update news-alert state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
