name: MT News Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run MT News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TIMEZONE: Europe/Warsaw
        run: python bot.py

      - name: TEST Telegram Topic
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"

          response = requests.post(
              url,
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "message_thread_id": int(os.environ["TELEGRAM_MESSAGE_THREAD_ID"]),
                  "text": "🚨 MT NEWS ALERT — TEST\n\nThis is a test message from the MT News Bot.\n\nThe connection to this topic works. ✅",
              },
              timeout=20,
          )

          print(response.text)
          response.raise_for_status()
          PY

      - name: Save state
        run: |
          git config user.name "MT News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db
          git diff --cached --quiet || git commit -m "Update alert state"
          git push
